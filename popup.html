<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grammar Checker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 18px 20px 14px;
      border-bottom: 1px solid #2d3748;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 100px; height: 100px;
      background: radial-gradient(circle, rgba(229,62,62,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, #e53e3e, #c53030);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 3px 10px rgba(229,62,62,0.35);
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 700;
      color: #f7fafc;
      letter-spacing: -0.3px;
    }

    .logo-sub {
      font-size: 11px;
      color: #718096;
      margin-top: 1px;
    }

    /* Main toggle card */
    .toggle-card {
      margin: 16px;
      background: #1a1a2e;
      border-radius: 12px;
      border: 1px solid #2d3748;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .toggle-title {
      font-size: 14px;
      font-weight: 600;
      color: #f7fafc;
    }

    .toggle-desc {
      font-size: 11px;
      color: #718096;
      line-height: 1.4;
    }

    /* Toggle switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 26px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #2d3748;
      border-radius: 26px;
      transition: 0.25s ease;
    }

    .slider::before {
      content: '';
      position: absolute;
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background: #a0aec0;
      border-radius: 50%;
      transition: 0.25s ease;
    }

    input:checked + .slider {
      background: linear-gradient(135deg, #e53e3e, #c53030);
    }

    input:checked + .slider::before {
      transform: translateX(20px);
      background: #fff;
    }

    /* Status indicator */
    .status-row {
      margin: 0 16px 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #1a2f1a;
      border: 1px solid #276227;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #68d391;
      transition: all 0.2s;
    }

    .status-row.disabled {
      background: #1a1a2e;
      border-color: #2d3748;
      color: #718096;
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #68d391;
      flex-shrink: 0;
      animation: pulse-green 2s infinite;
    }

    .status-row.disabled .status-dot {
      background: #4a5568;
      animation: none;
    }

    @keyframes pulse-green {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* How it works section */
    .how-section {
      margin: 0 16px 14px;
    }

    .how-title {
      font-size: 10px;
      font-weight: 600;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .how-steps {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .how-step {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      color: #a0aec0;
    }

    .step-icon {
      width: 22px; height: 22px;
      background: #1a1a2e;
      border: 1px solid #2d3748;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    /* Footer */
    .footer {
      border-top: 1px solid #1a2030;
      padding: 10px 16px;
      font-size: 10px;
      color: #4a5568;
      text-align: center;
    }

    .footer a {
      color: #4a5568;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-row">
      <div class="logo-icon">✏️</div>
      <div>
        <div class="logo-text">Grammar Checker</div>
        <div class="logo-sub">Powered by LanguageTool</div>
      </div>
    </div>
  </div>

  <div style="height: 16px;"></div>

  <!-- Toggle -->
  <div class="toggle-card">
    <div class="toggle-label">
      <div class="toggle-title">Grammar Checking</div>
      <div class="toggle-desc" id="toggle-desc">Checking all text inputs</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="mainToggle" checked />
      <span class="slider"></span>
    </label>
  </div>

  <!-- Status -->
  <div class="status-row" id="statusRow">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Active — checking as you type</span>
  </div>

  <!-- How it works -->
  <div class="how-section">
    <div class="how-title">How it works</div>
    <div class="how-steps">
      <div class="how-step">
        <div class="step-icon">⌨️</div>
        <span>Type in any text field</span>
      </div>
      <div class="how-step">
        <div class="step-icon">🔴</div>
        <span>A badge shows errors found</span>
      </div>
      <div class="how-step">
        <div class="step-icon">💡</div>
        <span>Click badge to see fixes</span>
      </div>
    </div>
  </div>

  <div class="footer">
    Grammar API by LanguageTool · Free &amp; private
  </div>

  <script src="popup.js"></script>
</body>
</html>
